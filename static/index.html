<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuRecall Board</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="app">
    <nav id="toolbar">
      <button id="btn-select" title="Select (v)" class="active">↖</button>
      <button id="btn-connect" title="Connect (c)">→</button>
      <button id="btn-pan" title="Pan / Hold (h)">✥</button>
      <button id="btn-create" title="New node (n)">+</button>
      <button id="btn-group" title="Group selected (g)">▣</button>
      <button id="btn-layout" title="Auto layout grid (l)">⌘</button>
      <button id="btn-radial" title="Radial layout">◎</button>
      <button id="btn-hierarchy" title="Hierarchy tree">▤</button>
      <button id="btn-force" title="Force-directed">✦</button>
      <button id="btn-concentric" title="Concentric groups">◉</button>
      <button id="btn-spiral" title="Spiral layout">🌀</button>
      <div class="spacer"></div>
      <button id="btn-refresh" title="Refresh (r)">↻</button>
    </nav>
    <div id="canvas-wrap">
      <svg id="board-svg" xmlns="http://www.w3.org/2000/svg">
        <g id="main-group">
          <g id="groups-group"></g>
          <g id="edges-group"></g>
          <g id="nodes-group"></g>
        </g>
      </svg>
      <div id="filterbar">
        <input id="filter-input" type="text" placeholder="Filter nodes…" />
      </div>
      <div id="statusbar">Loading…</div>
    </div>
    <aside id="sidebar" class="hidden">
      <h2>Details</h2>
      <div class="panel">
        <label>ID</label>
        <div id="detail-id" style="font-size:12px;color:var(--muted);margin-bottom:8px;"></div>
        <label>Label</label>
        <input id="detail-label" type="text" />
      </div>
      <div class="panel">
        <label>Kind</label>
        <select id="detail-kind">
          <option value="idea">idea</option>
          <option value="task">task</option>
          <option value="memory_ref">memory_ref</option>
          <option value="route_ref">route_ref</option>
          <option value="github_ref">github_ref</option>
          <option value="packet">packet</option>
          <option value="group">group</option>
          <option value="view">view</option>
        </select>
      </div>
      <div class="panel">
        <label>Summary</label>
        <textarea id="detail-summary"></textarea>
      </div>
      <div class="panel">
        <label>Tags</label>
        <div id="detail-tags" class="tag-list"></div>
      </div>
      <div class="panel" style="display:flex;gap:8px;">
        <button id="detail-save" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;cursor:pointer;">Save</button>
        <button id="detail-delete" style="padding:8px 12px;border:1px solid #e0a0a0;border-radius:var(--radius);background:#fff0f0;cursor:pointer;color:#c44;">Delete</button>
      </div>
    </aside>
  </div>
  <script src="/static/board.js" defer></script>
</body>
</html>
